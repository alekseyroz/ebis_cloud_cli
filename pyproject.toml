[project]
name = "ebis-cloud-cli"
version = "0.1.0"
description = "CLI for manually testing the ebis_cloud library"
requires-python = ">=3.14"
dependencies = [
    "ebis-cloud",
]

[project.scripts]
ebis = "cli:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.uv.sources]
ebis-cloud = { path = "../ebis_cloud" }
