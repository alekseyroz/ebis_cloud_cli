[project]
name = "veryon-wc-cli"
version = "0.1.0"
description = "CLI for manually testing the veryon_wc library"
requires-python = ">=3.14"
dependencies = [
    "veryon-wc",
]

[project.scripts]
veryonwc = "cli:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.uv.sources]
veryon-wc = { path = "../ebis_cloud" }

[tool.hatch.build.targets.wheel]
include = ["cli.py"]
